name: Build El Bouni Pièces Auto APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: elbouni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (rouge)
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compléter le squelette Android manquant
        run: |
          flutter create . --platforms=android --org com.elbouni.ajalaks --project-name el_bouni_pieces_auto
          echo "--- Vérification du squelette Gradle ---"
          test -f android/gradle/wrapper/gradle-wrapper.properties \
            && echo "OK : gradle-wrapper.properties présent" \
            || echo "ATTENTION : gradle-wrapper.properties toujours absent"

      - name: Activer Firebase (Google Services)
        run: |
          sed -i '/id("org.jetbrains.kotlin.android") version/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          echo "--- settings.gradle.kts ---"
          cat android/settings.gradle.kts
          echo "--- app/build.gradle.kts (plugins) ---"
          head -n 10 android/app/build.gradle.kts

      - name: Activer le desugaring (flutter_local_notifications)
        run: |
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          cat >> android/app/build.gradle.kts << 'EOF'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
          }
          EOF
          echo "--- Vérification ---"
          grep -A3 "compileOptions" android/app/build.gradle.kts
          tail -n 5 android/app/build.gradle.kts

      - name: Configurer un token de débogage App Check fixe
        run: |
          sed -i 's#</application>#    <meta-data android:name="firebase_app_check_debug_secret" android:value="e0a3d9f4-6b21-4c8a-9f77-2d5c8a731b90" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          echo "--- Vérification ---"
          grep -A1 "firebase_app_check_debug_secret" android/app/src/main/AndroidManifest.xml

      - name: Ajouter les règles ProGuard pour ML Kit (évite R8 missing classes)
        run: |
          mkdir -p android/app
          cat > android/app/proguard-rules.pro << 'EOF'
          # ===== google_mlkit_text_recognition =====
          -dontwarn com.google.mlkit.vision.text.**
          -keep class com.google.mlkit.vision.text.** { *; }
          -keep class com.google.mlkit.vision.text.chinese.** { *; }
          -keep class com.google.mlkit.vision.text.devanagari.** { *; }
          -keep class com.google.mlkit.vision.text.japanese.** { *; }
          -keep class com.google.mlkit.vision.text.korean.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_text_common.** { *; }

          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**

          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.**  { *; }
          -keep class io.flutter.util.**  { *; }
          -keep class io.flutter.view.**  { *; }
          -keep class io.flutter.**  { *; }
          -keep class io.flutter.plugins.**  { *; }
          EOF
          echo "OK : proguard-rules.pro créé"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Utiliser le keystore debug du dépôt (empreinte SHA fixe)
        run: |
          mkdir -p \~/.android
          if [ ! -f android/keystore/debug.keystore ]; then
            echo "ERREUR : android/keystore/debug.keystore introuvable dans le dépôt !"
            exit 1
          fi
          cp android/keystore/debug.keystore \~/.android/debug.keystore
          echo "OK : keystore du dépôt copié"
          keytool -list -v -keystore \~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"

          if [ -f android/app/build.gradle.kts ]; then
            if ! grep -q "import java.util.Properties" android/app/build.gradle.kts; then
              sed -i '1i import java.util.Properties\nimport java.io.FileInputStream' android/app/build.gradle.kts
            fi

            cat >> android/app/build.gradle.kts << 'EOF'

          // VROUM DZ — forcer le keystore debug du dépôt (SHA Firebase fixe)
          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("../keystore/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          EOF
            echo "OK : signingConfigs debug forcé"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug, garanti vert)
        run: flutter build apk --debug

      - name: Afficher SHA-256 du keystore debug
        run: |
          keytool -list -v -keystore \~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: Upload artifact (debug — pour tests directs sur téléphone)
        uses: actions/upload-artifact@v4
        with:
          name: EL-BOUNI-PIECES-AUTO
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          overwrite: true

      - name: Preparer les credentials de release
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          KS_B64: ${{ env.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ env.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ env.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' "$KS_PASS" "$KEY_PASS" "$KS_ALIAS" > android/key.properties
          echo "OK : keystore et key.properties prepares"
          ls -la android/app/release.keystore android/key.properties

      - name: Configurer la signature de release + ProGuard
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          if ! grep -q "import java.util.Properties" android/app/build.gradle.kts; then
            sed -i '1i import java.util.Properties\nimport java.io.FileInputStream' android/app/build.gradle.kts
          fi

          cat >> android/app/build.gradle.kts << 'EOF'

          // === Release signing + minify (ajouté par CI) ===
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  create("release") {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias = keystoreProperties["keyAlias"] as String
                          keyPassword = keystoreProperties["keyPassword"] as String
                          storeFile = file(keystoreProperties["storeFile"] as String)
                          storePassword = keystoreProperties["storePassword"] as String
                      }
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
          }
          EOF
          echo "OK : signingConfigs release + ProGuard ajoutés"
          tail -n 50 android/app/build.gradle.kts

      - name: Build AAB (release, signe - pour le Play Store)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: flutter build appbundle --release

      - name: Upload artifact (release AAB)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: VROUM-DZ-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          overwrite: true
