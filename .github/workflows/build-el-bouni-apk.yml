name: Build El Bouni Pièces Auto APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: elbouni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (rouge)
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compléter le squelette Android manquant
        run: |
          flutter create . --platforms=android --org com.elbouni.ajalaks --project-name el_bouni_pieces_auto
          echo "--- Vérification du squelette Gradle ---"
          test -f android/gradle/wrapper/gradle-wrapper.properties \
            && echo "OK : gradle-wrapper.properties présent" \
            || echo "ATTENTION : gradle-wrapper.properties toujours absent"

      - name: Activer Firebase (Google Services)
        run: |
          sed -i '/id("org.jetbrains.kotlin.android") version/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          echo "--- settings.gradle.kts ---"
          cat android/settings.gradle.kts
          echo "--- app/build.gradle.kts (plugins) ---"
          head -n 10 android/app/build.gradle.kts

      - name: Activer le desugaring (flutter_local_notifications)
        run: |
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          cat >> android/app/build.gradle.kts << 'EOF'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
          }
          EOF
          echo "--- Vérification ---"
          grep -A3 "compileOptions" android/app/build.gradle.kts
          tail -n 5 android/app/build.gradle.kts

      - name: Configurer un token de débogage App Check fixe
        run: |
          sed -i 's#</application>#    <meta-data android:name="firebase_app_check_debug_secret" android:value="e0a3d9f4-6b21-4c8a-9f77-2d5c8a731b90" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          echo "--- Vérification ---"
          grep -A1 "firebase_app_check_debug_secret" android/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Utiliser le keystore debug du dépôt (empreinte SHA fixe)
        run: |
          mkdir -p ~/.android
          if [ ! -f android/keystore/debug.keystore ]; then
            echo "ERREUR : android/keystore/debug.keystore introuvable dans le dépôt !"
            echo "Le SHA doit rester fixe. Arrêt du build."
            exit 1
          fi
          cp android/keystore/debug.keystore ~/.android/debug.keystore
          echo "OK : keystore du dépôt copié"
          echo "--- Empreinte SHA utilisée pour ce build ---"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"

          # Force Gradle à signer avec le keystore du dépôt (SHA Firebase fixe).
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts << 'EOF'

          // VROUM DZ — forcer le keystore debug du dépôt (SHA Firebase fixe)
          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("../keystore/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          EOF
            echo "OK : signingConfigs debug forcé dans build.gradle.kts"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug, garanti vert)
        run: flutter build apk --debug

      - name: Afficher SHA-256 du keystore debug
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: Upload artifact (debug — pour tests directs sur téléphone)
        uses: actions/upload-artifact@v6
        with:
          name: EL-BOUNI-PIECES-AUTO
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          overwrite: true

      # ========== FIX R8 / ML Kit (classes optionnelles manquantes) ==========
      - name: Ajouter règles ProGuard pour google_mlkit_text_recognition
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          cat > android/app/proguard-rules.pro << 'PROGUARD'
          # google_mlkit_text_recognition — langues optionnelles non utilisées
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.android.gms.internal.mlkit_vision_text_common.**
          -dontwarn com.google.mlkit.common.**
          -keep class com.google.mlkit.vision.text.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_text_common.** { *; }

          # Flutter / Firebase / autres
          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.** { *; }
          -keep class io.flutter.util.** { *; }
          -keep class io.flutter.view.** { *; }
          -keep class io.flutter.** { *; }
          -keep class io.flutter.plugins.** { *; }
          -dontwarn io.flutter.embedding.**
          PROGUARD

          # S'assurer que le buildType release utilise bien ces règles
          cat >> android/app/build.gradle.kts << 'EOF'

          android {
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
          }
          EOF
          echo "OK : proguard-rules.pro créé et lié au buildType release"
          cat android/app/proguard-rules.pro

      # Build de RELEASE (AAB signé)
      - name: Preparer les credentials de release
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          KS_B64: ${{ env.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ env.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ env.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' "$KS_PASS" "$KEY_PASS" "$KS_ALIAS" > android/key.properties
          echo "OK : keystore et key.properties prepares"

      - name: Configurer la signature de release
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          cat >> android/app/build.gradle.kts << 'EOF'

          android {
              signingConfigs {
                  create("release") {
                      val propsFile = rootProject.file("key.properties")
                      if (propsFile.exists()) {
                          val map = propsFile.readLines().mapNotNull { line ->
                              val idx = line.indexOf('=')
                              if (idx == -1) null else line.substring(0, idx) to line.substring(idx + 1)
                          }.toMap()
                          storeFile = file(map["storeFile"]!!)
                          storePassword = map["storePassword"]
                          keyAlias = map["keyAlias"]
                          keyPassword = map["keyPassword"]
                      }
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF
          echo "OK : signingConfigs release ajoute"

      - name: Build AAB (release, signe - pour le Play Store)
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: flutter build appbundle --release

      - name: Upload artifact (release AAB)
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v6
        with:
          name: VROUM-DZ-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          overwrite: true
