name: el_bouni_pieces_auto
description: VROUM DZ. Assurance OCR + Pièces auto Annaba/El Bouni.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_ai: ^2.3.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  cloud_functions: ^5.1.5
  http: ^1.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  google_mobile_ads: ^9.1.0
  flutter_localizations:
    sdk: flutter
  google_mlkit_text_recognition: ^0.13.1
  image_picker: ^0.8.7+5
  # Note vocale sur le scanner pièce : enregistrement (record) et
  # lecture côté magasin (audioplayers).
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  url_launcher: ^6.1.14
  # Géolocalisation réelle des magasins (position GPS à l'inscription) et
  # calcul de distance côté acheteur.
  geolocator: ^13.0.1
  cupertino_icons: ^1.0.6
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

# record 5.x tire record_linux 0.7.2, incompatible avec
# record_platform_interface (manque startStream / hasPermission).
# Sans ce override, `flutter build apk` échoue même pour Android
# car Flutter compile le code Dart de toutes les plateformes.
dependency_overrides:
  record_linux: ^1.1.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/video/
